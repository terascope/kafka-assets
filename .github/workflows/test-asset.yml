name: Test Teraslice Asset
run-name: ${{ github.actor }} is testing the Teraslice Asset
on:
  workflow_dispatch:
  push:
    branches:
      - master
      - 'release/kafka-assets-v*'
  pull_request:
    branches:
      - master
      - 'release/kafka-assets-v*'

permissions: {}

jobs:
  call-asset-test-workflow:
    uses: terascope/workflows/.github/workflows/asset-test.yml@0f818323dfaceab17bcfeda3e135e2b19d987691
    with:
      teraslice-cli-version: ${{ (startsWith(github.ref, 'refs/heads/release/') || startsWith(github.base_ref, 'release/')) && 'prerelease' || 'latest' }}
    permissions:
      actions: read
      contents: read
      pull-requests: write
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
